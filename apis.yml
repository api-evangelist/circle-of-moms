name: Circle of Moms
description: >-
  Circle of Moms was an online community for mothers, organized around topical mom groups, discussion
  threads and mom blogs, covering pregnancy, babies and infants, parenting and family health. It is a
  portfolio company of Uncork Capital (formerly SoftTech VC) and was later operated under the POPSUGAR
  brand, whose branding appears on archived captures of the site. The service is no longer operating:
  the circleofmoms.com domain is still registered but now redirects to the POPSUGAR Family page on
  Facebook, and its DNS is administered under Vox Media, POPSUGAR's parent. Circle of Moms never
  published a public API, developer portal, or partner platform — web-archive crawls of the domain
  contain no developer, API-documentation, or OAuth paths, and no developer or api subdomain has ever
  been recorded. This profile is retained as a historical company record with no API surface.
